<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    /* Global reset for consistent box-sizing */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0; /* Remove default body margin */
    }

    .card {
      background: #1e293b;
      padding: 28px; /* Slightly increased padding */
      border-radius: 12px;
      width: 340px; /* Slightly wider */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 24px; /* Increased bottom margin */
      font-size: 22px; /* Slightly larger text */
      font-weight: 600;
      text-align: center; /* Center the heading */
    }

    /* Spacing for form groups */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px; /* Space between label and input */
      font-size: 14px;
      font-weight: 500;
    }

    input {
      width: 100%; /* Use 100% with box-sizing */
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #e2e8f0;
      font-size: 15px; /* Optimized font size */
      transition: border-color 0.2s ease, box-shadow 0.2s ease; /* Add transition */
    }

    /* !! Key A11y & UI: Focus state !! */
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3); /* Glow effect */
      outline: none; /* Remove default outline for a custom one */
    }

    /* Visual feedback for error state */
    input.error {
      border-color: #fca5a5;
    }
    input.error:focus {
       box-shadow: 0 0 0 3px rgba(252, 165, 165, 0.3);
    }


    button {
      margin-top: 16px;
      width: 100%;
      padding: 11px; /* Slightly taller button */
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0b1220;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease,
        box-shadow 0.2s ease; /* Add transition */
    }

    /* UI: Hover state */
    button:hover:not(:disabled) {
      background: #0ea5e9;
      transform: translateY(-1px); /* Subtle lift */
    }

    /* A11y: Button focus state */
    button:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .err {
      color: #fca5a5;
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
      text-align: center; /* Center error message */
    }
  </style>
</head>

<body>
  <div class="card">
    <form id="loginForm">
      <h1>Login</h1>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button id="loginBtn" type="submit">Login</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>

  <script>
    // Get elements
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('err');
    const userEl = document.getElementById('username');
    const passEl = document.getElementById('password');

    // Listen to the form's 'submit' event, not the button's 'click'
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); // Prevent default form submission (page reload)

      btn.disabled = true;
      errEl.textContent = '';
      // Clear previous error states
      userEl.classList.remove('error');
      passEl.classList.remove('error');

      const username = userEl.value.trim();
      const password = passEl.value.trim();

      // === Core Login Logic (Unchanged) ===
      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include',
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Login failed');
        location.href = '/'; // Success: redirect
      } catch (e) {
        errEl.textContent = e.message;
        // UI: Add error class to inputs on failure
        userEl.classList.add('error');
        passEl.classList.add('error');
      } finally {
        btn.disabled = false;
      }
      // === End of Core Login Logic ===
    });
  </script>
</body>

</html>
